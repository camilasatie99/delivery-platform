server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: order-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/order_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # ADR-014: sete serviços relacionais no default de 10 estouram o
      # max_connections do PostgreSQL local.
      maximum-pool-size: 5
  jpa:
    hibernate:
      # Estrutura vem exclusivamente de migration.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        retry:
          enabled: true
          initial-interval: 2s
          max-attempts: 5

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWT_JWKS_URI:http://localhost:8081/.well-known/jwks.json}

delivery:
  # Swagger UI e /v3/api-docs sem token — ADR-050. Falso por padrão: esquecer fecha.
  docs:
    abertas: ${DELIVERY_DOCS_ABERTAS:false}
  jwt:
    issuer: ${JWT_ISSUER:http://localhost:8081}
    audience: ${JWT_AUDIENCE:delivery-platform}
  # A mesma porta de autorização do catalog: o token de quem pediu, encaminhado
  # ao merchant (ADR-011, ADR-045).
  autorizacao:
    merchant-uri: ${MERCHANT_URI:http://localhost:8082}
    tempo-de-conexao: 300ms
    tempo-de-leitura: 300ms
  # O preço do pedido é lido no cardápio público do catalog na hora de criar
  # (ADR-077). Fora do ar = 503, e o pedido não nasce.
  catalogo:
    catalog-uri: ${CATALOG_URI:http://localhost:8083}
    tempo-de-conexao: 500ms
    tempo-de-leitura: 2s
  pedidos:
    # O "hoje" da lista do painel. Todas as lojas da entrega de 15/11 estão
    # neste fuso; gatilho para ler o fuso de cada loja no merchant: a primeira
    # que não estiver.
    fuso: ${DELIVERY_PEDIDOS_FUSO:America/Sao_Paulo}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  # Como no catalog (ADR-053): cada rota declara as próprias recusas.
  override-with-generic-response: false
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.deliveryplatform: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n"
