<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>delivery-platform · painel</title>
    <meta name="description" content="Painel do comerciante." />
    <!-- ADR-070 §3: o token do convite mora na URL, e a página do convite chama o gateway,
         que é outra origem. Para outra origem vai só a origem, nunca o caminho. Era o padrão
         do navegador; declarado aqui, vira decisão do repositório. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!-- As fontes do protótipo, no <head> como no aki_delivery: o Inter e os ícones
         (Material Symbols, nas telas internas, e Material Icons, nas telas de entrada — o
         protótipo usava as duas). Sem a segunda, a tela de entrada mostrava o nome do ícone
         ("light_mode", "check_circle") em vez do desenho. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    />
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=block"
    />
  </head>

  </body>
</html>
